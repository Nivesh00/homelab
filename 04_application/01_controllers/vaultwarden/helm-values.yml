---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-helm-values
  namespace: ${ENVIRONMENT}-${ns_public}
data:
  values.yml: |-
    image:
      registry: docker.io
      repository: vaultwarden/server
      tag: "1.37.2-alpine"
      pullPolicy: IfNotPresent

    replicas: 1

    resources:
      limits:
        cpu: 200m
        memory: 300Mi
      requests:
        cpu: 50m
        memory: 100Mi

    storage:
      data:
        name: vaultwarden-data
        size: 5Gi
        class: ${k8s_storage_class}
        path: /data
        keepPvc: false
        accessMode: ReadWriteOnce
        labels: {}

      attachments:
        name: vaultwarden-files
        size: 10Gi
        class: 
        path: /files
        keepPvc: false
        accessMode: ReadWriteOnce
        labels: {}

    webVaultEnabled: "true"

    database:
      type: postgresql
      host: vaultwarden-db.${ENVIRONMENT}-${ns_public}
      port: 5432
      dbName: vaultwarden
      existingSecret: vaultwarden-owner-user.vaultwarden-db.credentials.postgresql.acid.zalan.do
      existingSecretUserKey: username
      existingSecretPasswordKey: password

    pushNotifications:
      enabled: false

    domain: https://vaultwarden.${DOMAIN}

    sendsAllowed: "true"

    signupsAllowed: false
    signupsVerify: "false"
    invitationsAllowed: true
    invitationOrgName: "Vaultwarden"
    invitationExpirationHours: "120"
    emergencyAccessAllowed: "true"
    emailChangeAllowed: "false"
    showPassHint: "false"

    adminToken:
      value: ${VW_ADMIN_TOKEN}

    timeZone: Europe/Berlin

    ingress:
      enabled: false

    httpRoute: {}

    sso:
      enabled: true
      onlySSO: true
      enforceSSO: true
      authority: https://iam.${DOMAIN}/realms/${KC_APP_REALM}
      scopes: "openid profile email offline_access"

      ignoreEmailVerification: false
      clientId:
        value: vaultwarden
      clientSecret:
        value: ${KC_CLIENT_SECRET_VAULTWARDEN}
---
