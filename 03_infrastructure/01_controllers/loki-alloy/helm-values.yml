---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-helm-values
  namespace: ${ENVIRONMENT}-${ns_monitoring}
data:
  values.yml: |-
    deploymentMode: Monolithic
    loki:
      image:
        registry: docker.io
        repository: grafana/loki
        tag: 3.7.6
        digest: null
        pullPolicy: IfNotPresent

      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true

      storage:
        type: filesystem
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

    serviceAccount:
      create: true

    gateway:
      enabled: true
      replicas: 1

      image:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
        tag: 1.31-alpine
        digest: null
        pullPolicy: IfNotPresent

      resources:
        limits:
          cpu: 80m
          memory: 80Mi
        requests:
          cpu: 20m
          memory: 20Mi

      metrics:
        enabled: true
        image:
          registry: ghcr.io
          repository: "jkroepke/access-log-exporter"
          tag: "0.4.11"
          pullPolicy: IfNotPresent

        resources:
          limits:
            cpu: 50m
            memory: 50Mi
          requests:
            cpu: 10m
            memory: 10Mi

    singleBinary:
      enabled: true
      kind: StatefulSet
      replicas: 1

      resources:
        limits:
          cpu: 150m
          memory: 150Mi
        requests:
          cpu: 50m
          memory: 50Mi

    monitoring:
      namespace: ${ENVIRONMENT}-${ns_monitoring}
      appInstanceLabelName: 'app_instance'
      appInstanceLabelValue: '{{ include "loki.fullname" . }}'

      multiCluster:
        enabled: false

      dashboards:
        enabled: true
        annotations:
          grafana_dashboard: "1"
          grafana_folder: "LOKI"
        defaultDashboardsTimezone: Europe/Berlin
        defaultDashboardsEditable: false
        defaultDashboardsInterval: 5m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-helm-values
  namespace: ${ENVIRONMENT}-${ns_monitoring}
data:
  values.yml: |-
    crds:
      create: true

    image:
      registry: "docker.io"
      repository: grafana/alloy
      tag: v1.19.0
      digest: null
      pullPolicy: IfNotPresent
      pullSecrets: []

    rbac:
      create: true

    serviceAccount:
      create: true

    alloy:
      configMap:
        create: true
        content: |-
          logging {
            level = "debug"
            format = "logfmt"
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.${ENVIRONMENT}-${ns_monitoring}/loki/api/v1/push:80"
            }
          }

          local.file_match "node_logs" {
            path_targets = [{
                __path__  = "/var/log/syslog",
                job       = "node/syslog",
                node_name = sys.env("HOSTNAME"),
            }]
          }

          loki.source.file "node_logs" {
            targets    = local.file_match.node_logs.targets
            forward_to = [loki.write.default.receiver]
          }

          discovery.kubernetes "pod" {
            role = "pod"
            selectors {
              role = "pod"
              field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
            }
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pod.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              action = "replace"
              target_label = "namespace"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              action = "replace"
              target_label = "pod"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "container"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              action = "replace"
              target_label = "app"
            }

            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "job"
              separator = "/"
              replacement = "$1"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              action = "replace"
              target_label = "__path__"
              separator = "/"
              replacement = "/var/log/pods/*$1/*.log"
            }

            rule {
              source_labels = ["__meta_kubernetes_pod_container_id"]
              action = "replace"
              target_label = "container_runtime"
              regex = `^(\S+):\/\/.+$`
              replacement = "$1"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          loki.process "pod_logs" {
            stage.static_labels {
                values = {
                  cluster = "${DOMAIN}",
                }
            }

            forward_to = [loki.write.default.receiver]
          }

          loki.source.kubernetes_events "cluster_events" {
            job_name   = "integrations/kubernetes/eventhandler"
            log_format = "logfmt"
            forward_to = [
              loki.process.cluster_events.receiver,
            ]
          }

          loki.process "cluster_events" {
            forward_to = [loki.write.default.receiver]

            stage.static_labels {
              values = {
                cluster = "${DOMAIN}",
              }
            }

            stage.labels {
              values = {
                kubernetes_cluster_events = "job",
              }
            }
          }

      resources:
        limits:
          cpu: 100m
          memory: 50Mi
        requests:
          cpu: "50m"
          memory: "50Mi"

    configReloader:
      enabled: true
      image:
        registry: "quay.io"
        repository: prometheus-operator/prometheus-config-reloader
        tag: v0.91.0@sha256:7d9e4eea5f1139e602508871f422b0116c60e87c662f3dcd234d5ab60cd0d8c1
        digest: ""
        pullPolicy: IfNotPresent
      customArgs: []
      resources:
        limits:
          cpu: 50m
          memory: 80Mi
        requests:
          cpu: "10m"
          memory: "30Mi"

    controller:
      type: 'daemonset'
---
