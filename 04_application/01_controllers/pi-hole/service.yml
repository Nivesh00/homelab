---
apiVersion: v1
kind: Service
metadata:
  name: pi-hole-svc
  namespace: ${ENVIRONMENT}-${ns_utils}
spec:
  selector:
    app: pi-hole
  ports:
    - protocol: TCP
      port: 53
      targetPort: 53
      name: tcp-53
    - protocol: TCP
      port: 80
      targetPort: 80
      name: tcp-80
    - protocol: TCP
      port: 443
      targetPort: 443
      name: tcp-443
---
