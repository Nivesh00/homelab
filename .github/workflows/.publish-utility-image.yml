name: .build and push utility image

on:
  push:
    paths:
      - 'files/dockerfiles/utility-tools'

env:
  DOCKER_REGISTRY_URL: ghcr.io
  DOCKER_REPOSITORY: nivesh00
  DOCKER_IMAGE_NAME: utility-tools

jobs:
  docker_image:
    runs-on: ubuntu-latest
    environment: homelab
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Do not get extra git branches to save time

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Build and Push the Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./files/dockerfiles/utility-tools
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY_URL }}/${{ env.DOCKER_REPOSITORY }}/${{ env.DOCKER_IMAGE_NAME }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}