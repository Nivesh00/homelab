name: 01 - Set up Keycloak

on: workflow_dispatch

jobs:
  checkout_code:
    runs-on: homelab-gha-runner
    container:
      image: ghcr.io/nivesh00/utility-tools
    environment: homelab
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Do not get extra git branches to save time

      - name: Upload scripts as artifact for later use
        uses: actions/upload-artifact@v7
        with:
          name: scripts-directory
          path: |-
            05_scripts/keycloak
            05_scripts/kubernetes

  wait_for_keycloak_resource:
    needs: checkout_code
    runs-on: homelab-gha-runner
    container:
      image: ghcr.io/nivesh00/utility-tools
    environment: homelab
    steps:
      - name: Download scripts artifact
        uses: actions/download-artifact@v8
        with:
          name: scripts-directory
          path: ./scripts

      - name: Wait for Keycloak to be ready
        run: |-
          cd scripts/kubernetes
          pip install --no-cache-dir -r requirements.txt
          echo "${{ secrets.KUBERNETES_ENV }}" > .env
          python3 01_wait_for_resource.py --load-env --incluster

  setup_keycloak:
    needs: wait_for_keycloak_resource
    runs-on: homelab-gha-runner
    container:
      image: ghcr.io/nivesh00/utility-tools
    environment: homelab
    steps:
      - name: Download scripts artifact
        uses: actions/download-artifact@v8
        with:
          name: scripts-directory
          path: ./05_scripts

      - name: Setup Keycloak
        run: |-
          cd scripts/keycloak
          pip install --no-cache-dir -r requirements.txt
          echo "${{ secrets.KEYCLOAK_ENV }}" > .env
          python3 01_create_user_and_realm.py --load-env
