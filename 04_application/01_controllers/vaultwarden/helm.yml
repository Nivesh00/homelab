---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vaultwarden
  namespace: ${ENVIRONMENT}-${ns_public}
spec:
  interval: 30m
  url: https://guerzon.github.io/vaultwarden
  type: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: ${ENVIRONMENT}-${ns_public}
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: vaultwarden
      version: v0.46.1
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
      interval: 30m
  releaseName: vaultwarden
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  valuesFrom:
    - kind: ConfigMap
      name: vaultwarden-helm-values
      valuesKey: values.yml
  driftDetection:
    mode: enabled
---
