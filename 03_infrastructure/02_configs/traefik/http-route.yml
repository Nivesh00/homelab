---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: ${ENVIRONMENT}-${ns_data}
spec:
  parentRefs:
    - name: ${tr_gateway} # ${tr_listener_set_prd}
      sectionName: grafana
      group: gateway.networking.k8s.io
      kind: Gateway # ListenerSet
      namespace: ${ns_traefik}

  hostnames:
    - grafana.${DOMAIN}

  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /

       backendRefs:
        - name: grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: ${ENVIRONMENT}-${ns_iam}
spec:
  parentRefs:
    - name: ${tr_gateway}
      sectionName: keycloak
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ${ns_traefik}

  hostnames:
    - iam.${DOMAIN}

  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /

       backendRefs:
        - name: keycloak-service
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
  namespace: ${ENVIRONMENT}-${ns_iam}
spec:
  parentRefs:
    - name: ${tr_gateway}
      sectionName: keycloak-admin
      group: gateway.networking.k8s.io
      kind: Gateway
      namespace: ${ns_traefik}

  hostnames:
    - iam-admin.${DOMAIN}

  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /

       backendRefs:
        - name: keycloak-service
          port: 8080
---
