---
# Main keycloak instance
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: ${ENVIRONMENT}-${ns_iam}
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db
    database: keycloak
    port: 5432
    schema: keycloak_data
    usernameSecret:
      name: keycloak-owner-user.keycloak-db.credentials.postgresql.acid.zalan.do
      key: username
    passwordSecret:
      name: keycloak-owner-user.keycloak-db.credentials.postgresql.acid.zalan.do
      key: password
  ingress:
    enabled: false
  http:
    httpEnabled: false
    serviceHttpPort: 8080
  hostname:
    hostname: https://iam.${DOMAIN}
    admin: https://iam.${DOMAIN}/admin
    strict: true
  proxy:
    headers: xforwarded
  resources:
    limits:
      cpu: 600m
      memory: 850Mi
    requests:
      cpu: 200m
      memory: 600Mi
---
