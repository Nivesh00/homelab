---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: ${ENVIRONMENT}-${ns_public}
spec:
  interval: 30m
  url: https://jellyfin.github.io/jellyfin-helm
  type: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: ${ENVIRONMENT}-${ns_public}
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: jellyfin
      version: 3.2.0
      sourceRef:
        kind: HelmRepository
        name: jellyfin
      interval: 30m
  releaseName: jellyfin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  valuesFrom:
    - kind: ConfigMap
      name: jellyfin-helm-values
      valuesKey: values.yml
  driftDetection:
    mode: enabled
---
