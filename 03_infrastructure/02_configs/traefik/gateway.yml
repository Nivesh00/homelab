---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${tr_gateway}
  namespace: ${ns_traefik}
  annotations:
    cert-manager.io/cluster-issuer: ${cm_cluster_issuer_stg}
spec:
  gatewayClassName: ${tr_gateway_class}

  # https://github.com/kubernetes-sigs/gateway-api/issues/4425
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
          namespaces:
            from: All

    - name: monitoring-grafana
      hostname: monitoring.${DOMAIN}
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - name: monitoring-grafana-tls
            kind: Secret
            group: ""

      allowedRoutes:
        namespaces:
          from: All

  # allowedListeners:
  #   namespaces:
  #     from: All