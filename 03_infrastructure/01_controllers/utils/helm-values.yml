apiVersion: v1
kind: ConfigMap
metadata:
  name: gha-runner-controller-helm-values
  namespace: ${ENVIRONMENT}-${ns_utils}
data:
  values.yml: |-
    replicaCount: 1

    image:
      repository: "ghcr.io/actions/gha-runner-scale-set-controller"
      pullPolicy: IfNotPresent
      tag: 0.14.2

    flags:
      logLevel: "info"
      logFormat: "text"

    githubConfigUrl: ${gh_config_url}
    githubConfigSecret:
      github_token: ${gh_config_token}

    resources:
      limits:
        cpu: 250m
        memory: 250Mi
      requests:
        cpu: 50m
        memory: 50Mi
