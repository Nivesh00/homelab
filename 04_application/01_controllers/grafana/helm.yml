---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: ${ENVIRONMENT}-${ns_data}
spec:
  interval: 30m
  url: https://grafana.github.io/helm-charts
  type: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: ${ENVIRONMENT}-${ns_data}
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 30m
  releaseName: grafana
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  valuesFrom:
    - kind: ConfigMap
      name: grafana-helm-values
      valuesKey: values.yml
  driftDetection:
    mode: enabled
---
