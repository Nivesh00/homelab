---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-helm-values
  namespace: ${ENVIRONMENT}-${ns_monitoring}
data:
  values.yml: |-
    crds:
      enabled: true

    defaultRules:
      create: true

    alertmanager:
      enabled: false

    grafana:
      enabled: false
      forceDeployDatasources: true
      forceDeployDashboards: true
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: Europe/Berlin
      defaultDashboardsEditable: false
      defaultDashboardsInterval: 5m

      sidecar:
        dashboards:
          annotations:
            grafana_folder: "KUBE-METIRCS"

    kubernetesServiceMonitors:
      enabled: true

    kubeApiServer:
      enabled: true

    kubelet:
      enabled: true
      namespace: kube-system

    kubeControllerManager:
      enabled: true

    coreDns:
      enabled: true

    kubeDns:
      enabled: false

    kubeEtcd:
      enabled: true

    kubeScheduler:
      enabled: true

    kubeProxy:
      enabled: true

    nodeExporter:
      enabled: true

    prometheusOperator:
      enabled: true
      image:
        registry: quay.io
        repository: prometheus-operator/prometheus-operator
        # if not set appVersion field from Chart.yaml is used
        tag: v0.91.0
        sha: ""
        pullPolicy: IfNotPresent

      resources:
        limits:
          cpu: 150m
          memory: 150Mi
        requests:
          cpu: 80m
          memory: 50Mi

      prometheusConfigReloader:
        image:
          registry: quay.io
          repository: prometheus-operator/prometheus-config-reloader
          # if not set appVersion field from Chart.yaml is used
          tag: v0.91.0
          sha: ""

        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            cpu: 50m
            memory: 50Mi

      admissionWebhooks:
        deployment:
          image:
            registry: quay.io
            repository: prometheus-operator/admission-webhook
            tag: ""
            sha: ""
            pullPolicy: IfNotPresent

          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            cpu: 50m
            memory: 50Mi

        patch:
          enabled: true
          image:
            registry: ghcr.io
            repository: jkroepke/kube-webhook-certgen
            tag: 1.8.4
            sha: ""
            pullPolicy: IfNotPresent

          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            cpu: 50m
            memory: 50Mi

    prometheus:
      enabled: true
      prometheusSpec:
        image:
          registry: quay.io
          repository: prometheus/prometheus
          tag: v3.12.0-distroless
          sha: ""
          pullPolicy: IfNotPresent

        resources:
          limits:
            cpu: 350m
            memory: 750Mi
          requests:
            cpu: 150m
            memory: 400Mi

        ## The ConfigMaps are mounted into /etc/prometheus/configmaps/.
        configMaps: []

        retention: 10d
        retentionSize: 8GiB

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ${k8s_storage_class}
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

        additionalScrapeConfigs: []

      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

      additionalServiceMonitors: []
      additionalPodMonitors: []
---
