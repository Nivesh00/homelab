---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gha-runner-helm-repo
  namespace: ${ENVIRONMENT}-${ns_utils}
spec:
  interval: 30m
  url: oci://ghcr.io/actions/actions-runner-controller-charts
  type: oci
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-controller
  namespace: ${ENVIRONMENT}-${ns_utils}
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: gha-runner-helm-repo
      interval: 30m
  releaseName: gha-runner-controller
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  valuesFrom:
    - kind: ConfigMap
      name: gha-runner-controller-helm-values
      valuesKey: values.yml
  driftDetection:
    mode: enabled
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner
  namespace: ${ENVIRONMENT}-${ns_utils}
spec:
  interval: 30m
  timeout: 5m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.14.2
      sourceRef:
        kind: HelmRepository
        name: gha-runner-helm-repo
      interval: 30m
  releaseName: gha-runner
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  valuesFrom:
    - kind: ConfigMap
      name: gha-runner-helm-values
      valuesKey: values.yml
  driftDetection:
    mode: enabled
---
